id: specialist-n8n-automation-rescue
name: "n8n Automation Rescue"
version: 0.1.0
kind: specialist
service: n8n-automation-rescue
category: "Engineering"
readiness: "Foundation ready"
autonomy: approval-gated
mission: "A named cause with the evidence that excluded the alternatives, and the smallest safe correction prepared as a workflow diff with a regression run plan and a way back, ready for the workflow's owner to import."
runtime:
  preferred: "OpenAI Agents SDK"
  alternatives:
    - "LangGraph"
    - "PydanticAI"
    - "CrewAI"
  state: durable-run-ledger
skills:
  - "Intake: Take the workflow export, the failing execution ids and the state the business is left in"
  - "Reproduce: Replay the exported workflow against its recorded executions until the failure is deterministic"
  - "Diagnose: Test the credential, schema, rate and logic families against the failing executions"
  - "Repair: Prepare the smallest safe correction as a node-by-node workflow diff"
  - "Check: Re-run the reproduction and the regression set against the patched export, independently of whoever wrote the diff"
  - "Hand over: Prepare the import package, the regression run plan and the way back for the owner"
tools:
  - "existing-n8n"
  - "client-supplied-workflow-export"
  - "client-tracing"
  - "vvdex-workflow-diagnosis"
inputs:
  - "client objective"
  - "verified customer facts"
  - "system permissions"
  - {"id":"workflow-export","question":"Which workflow is failing, and can you export it as JSON together with the ids of the failing executions?","recommendation":"One workflow, exported from the instance it actually runs on, plus the execution ids of at least three failures and two successes. The successes matter as much as the failures: the difference between them is usually where the cause is. Export rather than screenshot — a rescue reproduced from a description of a workflow is a guess, and the export is also what the prepared diff is computed against.","whyAsking":"The export and the executions are the entire evidence base: without them nothing can be replayed, and a fix that was never replayed is a change rather than a repair.","blocking":true,"kind":"schema"}
  - {"id":"failure-shape","question":"What does the failure look like from the business's side, and how often does it happen?","recommendation":"Describe what a person notices — the invoice that never reached the accounting system, the lead that arrived twice — and attach a count over a stated window, for example nine of the last two hundred runs in the last fourteen days. A workflow that fails loudly and one that quietly writes half a record are different engagements, and the second is the one that has usually been running wrong for months.","whyAsking":"The business symptom decides which executions are worth replaying, and the rate is the number the repair has to move to be called proven.","blocking":true,"kind":"other"}
  - {"id":"instance-and-owner","question":"Which instance does it run on, and who is allowed to import a change into it?","recommendation":"Name the instance and one person who can both approve the import and undo it afterwards. That person is the single gate this engagement has: nothing is imported without them, and the prepared package is written for them to apply rather than for us to apply on their behalf. Where an agency or a former contractor administers the instance, the owner is whoever can revoke that access, not whoever holds it today.","whyAsking":"Everything after the diagnosis is a change to a system we do not own, and this is the person who authorizes it and can put it back.","blocking":true,"kind":"owner"}
outputs:
  - "Rescue brief"
  - "Deterministic failure case"
  - "Root cause with evidence"
  - "Workflow diff"
  - "Independent check report"
  - "Prepared import package"
memory:
  - "run working memory"
  - "tenant facts"
  - "verified outcome memory"
handoffs:
  - "vvdex-orchestrator"
  - "project-brain"
  - "evidence-qa"
guardrails:
  - "Importing a prepared workflow diff into the client's own instance"
  - "Reading an execution log that carries the client's customer data"
  - "Any external communication sent in the customer’s name"
  - "Any irreversible write, delete, payment or permission change"
  - "Any action below the configured confidence or policy threshold"
