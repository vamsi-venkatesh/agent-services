name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Validate packs
        run: npm run validate
      - name: Verify the sealed bundle
        run: npm run verify
      - name: Check the README against the data
        run: npm run readme
      - name: Test
        run: npm test
